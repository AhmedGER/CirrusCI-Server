# .cirrus.yml - باستخدام Serveo (مجاني 100% - يدعم TCP للـ Minecraft)
container:
  image: ubuntu:22.04
  cpu: 8
  memory: 24G

env:
  GITHUB_TOKEN: ENCRYPTED[!4b0eae3c2c6c631068eeedfaa0d2c0aa44b3c52d2e3d50dc4f5fb71f958d334548e3f4d70eeb23292bfb454df755b503!]
  CIRRUS_API_TOKEN: ENCRYPTED[!4336ebf698c76189e6057b84bf85a3809af77f5e5db08cf99abeea89c96a5ef9b34480dad12847b35388578fef3ba6ed!]
  DEBIAN_FRONTEND: noninteractive

task:
  name: Minecraft Fabric Server with Serveo
  timeout_in: 120m
  
  # تثبيت المتطلبات الأساسية
  setup_script:
    - apt-get update -qq
    - apt-get install -y openjdk-21-jre-headless git curl jq wget openssh-client -qq
    - echo "eula=true" > eula.txt
  
  # تحميل Fabric server (إذا لم يكن موجود)
  download_server_script:
    - |
      if [ ! -f "fabric-server.jar" ]; then
        echo "⬇️  Downloading Fabric Server..."
        # غير الرابط ده بالإصدار اللي أنت عايزه
        wget -q -O fabric-server.jar https://meta.fabricmc.net/v2/versions/loader/1.21.1/0.16.9/1.0.1/server/jar
        echo "✅ Fabric server downloaded!"
      else
        echo "✅ Fabric server already exists!"
      fi
  
  # بدء Serveo TCP tunnel
  start_serveo_tunnel_script:
    - |
      echo "🚀 Starting Serveo TCP tunnel for Minecraft..."
      echo ""
      
      # Serveo يدعم TCP tunneling بدون تسجيل!
      # لو طلبت port غير 80/443، هيعمل raw TCP forwarding
      (
        ssh -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o ExitOnForwardFailure=yes \
            -R 25565:localhost:25565 \
            serveo.net 2>&1 | tee serveo.log
      ) &
      
      TUNNEL_PID=$!
      echo "✅ Serveo tunnel started with PID: $TUNNEL_PID"
      
      # انتظر للـ tunnel يتأسس
      echo "⏳ Waiting 20 seconds for tunnel to establish..."
      sleep 20
      
      # استخرج معلومات الـ tunnel
      echo ""
      echo "=========================================="
      echo "📡 Serveo Tunnel Information"
      echo "=========================================="
      
      if [ -f "serveo.log" ]; then
        # اطبع اللوج للـ debugging
        cat serveo.log
        echo ""
        
        # Serveo بيطبع الـ URL في شكل: Forwarding TCP traffic from serveo.net:XXXXX
        SERVEO_URL=$(grep -oP 'serveo\.net:\d+' serveo.log | head -1)
        
        if [ -n "$SERVEO_URL" ]; then
          echo "=========================================="
          echo "🎮 MINECRAFT SERVER ADDRESS:"
          echo "   $SERVEO_URL"
          echo "=========================================="
          echo "$SERVEO_URL" > minecraft_address.txt
          echo ""
          echo "✨ Copy the address above and use it in Minecraft!"
        else
          echo "⚠️  Tunnel URL not detected yet, waiting 10 more seconds..."
          sleep 10
          
          SERVEO_URL=$(grep -oP 'serveo\.net:\d+' serveo.log | head -1)
          if [ -n "$SERVEO_URL" ]; then
            echo "🎮 Minecraft Server: $SERVEO_URL"
            echo "$SERVEO_URL" > minecraft_address.txt
          else
            echo "❌ Could not detect tunnel URL"
            echo "📋 Check the log above for the address"
          fi
        fi
      else
        echo "❌ serveo.log not found!"
      fi
      
      echo "=========================================="
      echo ""
  
  # بدء Minecraft Server
  run_minecraft_server_script:
    - |
      echo "🎮 Starting Minecraft Fabric Server..."
      echo ""
      
      # شغل السيرفر مع JVM flags محسّنة للأداء
      java -Xmx22G -Xms18G \
        -XX:+UseG1GC \
        -XX:+ParallelRefProcEnabled \
        -XX:MaxGCPauseMillis=200 \
        -XX:+UnlockExperimentalVMOptions \
        -XX:+DisableExplicitGC \
        -XX:+AlwaysPreTouch \
        -XX:G1NewSizePercent=30 \
        -XX:G1MaxNewSizePercent=40 \
        -XX:G1HeapRegionSize=16M \
        -XX:G1ReservePercent=20 \
        -XX:G1HeapWastePercent=5 \
        -XX:G1MixedGCCountTarget=4 \
        -XX:InitiatingHeapOccupancyPercent=15 \
        -XX:G1MixedGCLiveThresholdPercent=90 \
        -XX:G1RSetUpdatingPauseTimePercent=5 \
        -XX:SurvivorRatio=32 \
        -XX:+PerfDisableSharedMem \
        -XX:MaxTenuringThreshold=1 \
        -jar fabric-server.jar nogui &
      
      SERVER_PID=$!
      echo "✅ Minecraft server started with PID: $SERVER_PID"
      
      # اطبع العنوان مرة تانية
      if [ -f "minecraft_address.txt" ]; then
        echo ""
        echo "╔════════════════════════════════════════╗"
        echo "║   🎮 MINECRAFT SERVER IS ONLINE! 🎮   ║"
        echo "╠════════════════════════════════════════╣"
        echo "║  Server: $(cat minecraft_address.txt | tr -d '\n')                    ║"
        echo "╚════════════════════════════════════════╝"
        echo ""
      fi
      
      # مدة التشغيل: 110 دقيقة
      MAX_TIME=6600
      ELAPSED=0
      
      # monitor السيرفر
      while [ $ELAPSED -lt $MAX_TIME ]; do
        # تحقق إذا السيرفر لسه شغال
        if ! kill -0 $SERVER_PID 2>/dev/null; then
          echo ""
          echo "❌ ERROR: Minecraft server stopped unexpectedly!"
          if [ -f "logs/latest.log" ]; then
            echo "📋 Last 50 lines of server log:"
            tail -n 50 logs/latest.log
          fi
          break
        fi
        
        sleep 30
        ELAPSED=$((ELAPSED + 30))
        
        # تحديثات دورية
        if [ $((ELAPSED % 600)) -eq 0 ]; then
          MINUTES=$((ELAPSED / 60))
          echo "⏱️  [$(date +%H:%M:%S)] Server running for $MINUTES minutes"
          
          # اطبع آخر log line
          if [ -f "logs/latest.log" ]; then
            LAST_LOG=$(tail -n 1 logs/latest.log 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g')
            if [ -n "$LAST_LOG" ]; then
              echo "   📝 $LAST_LOG"
            fi
          fi
        fi
      done
      
      # إيقاف آمن للسيرفر
      echo ""
      echo "🛑 Initiating graceful server shutdown..."
      
      if kill -0 $SERVER_PID 2>/dev/null; then
        # حاول ترسل stop command
        echo "Sending 'stop' command to server..."
        sleep 5
        
        # SIGTERM
        kill -TERM $SERVER_PID 2>/dev/null || true
        echo "Waiting for server to stop..."
        sleep 10
        
        # SIGKILL لو لسه شغال
        if kill -0 $SERVER_PID 2>/dev/null; then
          echo "Force killing server..."
          kill -9 $SERVER_PID 2>/dev/null || true
        fi
      fi
      
      # أوقف Serveo tunnel
      echo "🛑 Stopping Serveo tunnel..."
      pkill -TERM ssh 2>/dev/null || true
      sleep 3
      
      echo "✅ Server shutdown complete!"
  
  # احفظ الـ world دايماً (حتى لو في errors)
  always:
    save_world_to_github_script:
      - |
        echo ""
        echo "💾 =========================================="
        echo "💾 Saving world data to GitHub..."
        echo "💾 =========================================="
        
        git config user.email "bot@cirrus-ci.com"
        git config user.name "Cirrus CI Bot"
        
        # أضف كل التغييرات
        git add -A
        
        # تحقق إذا في تغييرات
        if ! git diff --cached --quiet; then
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          FILES_CHANGED=$(git diff --cached --numstat | wc -l)
          
          echo "📝 Changes detected: $FILES_CHANGED file(s) modified"
          git commit -m "Auto-save world: $TIMESTAMP"
          
          # push مع 3 محاولات
          echo "📤 Pushing to GitHub..."
          SUCCESS=0
          
          for ATTEMPT in 1 2 3; do
            echo "   Attempt $ATTEMPT/3..."
            if git push https://x-access-token:${GITHUB_TOKEN}@github.com/${CIRRUS_REPO_FULL_NAME}.git HEAD:main; then
              echo "✅ World saved successfully to GitHub!"
              SUCCESS=1
              break
            else
              echo "⚠️  Push failed, retrying in 5 seconds..."
              sleep 5
            fi
          done
          
          if [ $SUCCESS -eq 0 ]; then
            echo "❌ Failed to push after 3 attempts!"
            echo "⚠️  World data may not be saved!"
          fi
        else
          echo "ℹ️  No changes detected - nothing to save"
        fi
        
        echo "💾 =========================================="
    
    # أعد تشغيل الـ build تلقائياً
    auto_retrigger_build_script:
      - |
        echo ""
        echo "🔄 =========================================="
        echo "🔄 Auto-retriggering next build session..."
        echo "🔄 =========================================="
        
        # انتظر دقيق
        
        OWNER=$(echo ${CIRRUS_REPO_FULL_NAME} | cut -d/ -f1)
        REPO=$(echo ${CIRRUS_REPO_FULL_NAME} | cut -d/ -f2)
        
        echo "📡 Fetching repository ID for ${OWNER}/${REPO}..."
        
        # احصل على repository ID من Cirrus API
        REPO_ID=$(curl -s \
          -H "Authorization: Bearer ${CIRRUS_API_TOKEN}" \
          -H "Content-Type: application/json" \
          -d "{\"query\":\"query { githubRepository(owner: \\\"${OWNER}\\\", name: \\\"${REPO}\\\") { id } }\"}" \
          https://api.cirrus-ci.com/graphql | jq -r '.data.githubRepository.id')
        
        echo "📋 Repository ID: $REPO_ID"
        
        if [ -n "$REPO_ID" ] && [ "$REPO_ID" != "null" ]; then
          echo "🚀 Triggering new build..."
          
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${CIRRUS_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation { trigger(input: {repositoryId: \\\"${REPO_ID}\\\", branch: \\\"main\\\"}) { build { id } } }\"}" \
            https://api.cirrus-ci.com/graphql)
          
          BUILD_ID=$(echo $RESPONSE | jq -r '.data.trigger.build.id')
          
          if [ -n "$BUILD_ID" ] && [ "$BUILD_ID" != "null" ]; then
            echo "✅ New build triggered successfully!"
            echo "🆔 Build ID: $BUILD_ID"
            echo "🔗 https://cirrus-ci.com/build/$BUILD_ID"
          else
            echo "❌ Failed to trigger new build"
            echo "📋 API Response: $RESPONSE"
          fi
        else
          echo "❌ Failed to get repository ID!"
          echo "📋 Check your CIRRUS_API_TOKEN"
        fi
        
        echo "🔄 =========================================="
