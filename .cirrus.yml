container:
  image: ubuntu:22.04
  cpu: 8
  memory: 24G

env:
  GITHUB_TOKEN: ENCRYPTED[!PUT_GITHUB_TOKEN!]
  CIRRUS_API_TOKEN: ENCRYPTED[!PUT_CIRRUS_TOKEN!]
  DEBIAN_FRONTEND: noninteractive

task:
  name: Minecraft + NeoTunnel
  timeout_in: 120m

  setup_script:
    - apt-get update -qq
    - apt-get install -y openjdk-21-jre-headless git curl jq wget unzip -qq
    - echo "eula=true" > eula.txt

  get_neotunnel_script:
    - |
      if [ ! -f neotunnel ]; then
        curl -s https://raw.githubusercontent.com/NeoCloudDev/NeoTunnel/master/install.sh | bash
      fi
      chmod +x neotunnel

  start_neotunnel_script:
    - |
      ./neotunnel --port 25565 --name server-$(date +%s) > neotunnel.log 2>&1 &
      sleep 10
      grep -oP 'tcp://[0-9a-zA-Z\.\-:]*' neotunnel.log | head -n 1 > minecraft_server_address.txt || true

  get_fabric_script:
    - |
      if [ ! -f fabric-server.jar ]; then
        wget -q -O fabric-server.jar https://meta.fabricmc.net/v2/versions/loader/1.21.1/0.16.9/1.0.1/server/jar
      fi

  start_server_script:
    - |
      java -Xmx22G -Xms18G -jar fabric-server.jar nogui &
      SERVER_PID=$!

      MAX_TIME=6600
      ELAPSED=0
      while [ $ELAPSED -lt $MAX_TIME ]; do
        if ! kill -0 $SERVER_PID 2>/dev/null; then break; fi
        sleep 30
        ELAPSED=$((ELAPSED + 30))
      done

      kill -TERM $SERVER_PID 2>/dev/null || true
      sleep 4
      kill -9 $SERVER_PID 2>/dev/null || true

      pkill -TERM neotunnel 2>/dev/null || true
      pkill -9 neotunnel 2>/dev/null || true

  always:
    save_world_script:
      - |
        git config user.email "bot@cirrus-ci.com"
        git config user.name "Cirrus Bot"
        git add -A
        if ! git diff --cached --quiet; then
          git commit -m "Autosave $(date -u)"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${CIRRUS_REPO_FULL_NAME}.git HEAD:main
        fi

    retrigger_script:
      - |
        OWNER=$(echo ${CIRRUS_REPO_FULL_NAME} | cut -d/ -f1)
        REPO=$(echo ${CIRRUS_REPO_FULL_NAME} | cut -d/ -f2)
        REPO_ID=$(curl -s -H "Authorization: Bearer ${CIRRUS_API_TOKEN}" \
        -H "Content-Type: application/json" \
        -d "{\"query\":\"query { githubRepository(owner: \\\"$OWNER\\\", name: \\\"$REPO\\\") { id } }\"}" \
        https://api.cirrus-ci.com/graphql | jq -r '.data.githubRepository.id')

        if [ "$REPO_ID" != "null" ]; then
          curl -s -X POST \
          -H "Authorization: Bearer ${CIRRUS_API_TOKEN}" \
          -H "Content-Type: application/json" \
          -d "{\"query\":\"mutation { trigger(input: {repositoryId: \\\"$REPO_ID\\\", branch: \\\"main\\\"}) { build { id } } }\"}" \
          https://api.cirrus-ci.com/graphql >/dev/null
        fi
