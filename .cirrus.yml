# .cirrus.yml - Simple terminal + tmux for Minecraft + NeoTunnel
container:
  image: ubuntu:22.04
  cpu: 8
  memory: 24G

task:
  name: Terminal for Minecraft + NeoTunnel
  timeout_in: 120m

  setup_script:
    - apt-get update -qq
    - apt-get install -y openjdk-21-jre-headless git curl wget tmux -qq
    - echo "✅ Setup complete!"

  run_script:
    - |
      echo "🎮 Starting interactive session..."
      echo "Use 'tmux new -s mcserver' to start tmux session for Minecraft + NeoTunnel"
      echo "Inside tmux you can run your commands and detach with Ctrl+b d"
      bash
