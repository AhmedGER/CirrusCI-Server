# .cirrus.yml - باستخدام localhost.run (مجاني 100% بدون تسجيل)
container:
  image: ubuntu:22.04
  cpu: 8
  memory: 24G

env:
  GITHUB_TOKEN: ENCRYPTED[!4b0eae3c2c6c631068eeedfaa0d2c0aa44b3c52d2e3d50dc4f5fb71f958d334548e3f4d70eeb23292bfb454df755b503!]
  CIRRUS_API_TOKEN: ENCRYPTED[!4336ebf698c76189e6057b84bf85a3809af77f5e5db08cf99abeea89c96a5ef9b34480dad12847b35388578fef3ba6ed!]
  DEBIAN_FRONTEND: noninteractive

task:
  name: Minecraft Fabric Server with localhost.run
  timeout_in: 120m
  
  # تثبيت المتطلبات الأساسية
  setup_script:
    - apt-get update -qq
    - apt-get install -y openjdk-21-jre-headless git curl jq wget screen openssh-client -qq
    - echo "eula=true" > eula.txt
  
  # تحميل Fabric server (إذا لم يكن موجود)
  download_server_script:
    - |
      if [ ! -f "fabric-server.jar" ]; then
        echo "Downloading Fabric Server..."
        # غير الرابط ده بالإصدار اللي أنت عايزه
        wget -q -O fabric-server.jar https://meta.fabricmc.net/v2/versions/loader/1.21.1/0.16.9/1.0.1/server/jar
      fi
  
  # بدء localhost.run tunnel في الـ background
  start_tunnel_script:
    - |
      echo "🚀 Starting localhost.run TCP tunnel for port 25565..."
      
      # localhost.run بيشتغل بالـ SSH بدون أي تسجيل!
      # شغله في الـ background
      (
        ssh -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o ExitOnForwardFailure=yes \
            -R 80:localhost:25565 \
            nokey@localhost.run 2>&1 | tee tunnel.log
      ) &
      
      TUNNEL_PID=$!
      echo "✅ Tunnel process started with PID: $TUNNEL_PID"
      
      # انتظر عشان الـ tunnel يتأسس
      echo "⏳ Waiting for tunnel to establish (20 seconds)..."
      sleep 20
      
      # استخرج الـ tunnel URL من اللوج
      echo ""
      echo "======================================"
      echo "📡 Tunnel Information:"
      echo "======================================"
      
      if [ -f "tunnel.log" ]; then
        # اطبع كل اللوج للـ debugging
        cat tunnel.log
        echo ""
        
        # localhost.run بيطبع URL في الشكل ده: https://xxxxx.lhr.rocks
        TUNNEL_URL=$(grep -oP 'https://[a-z0-9-]+\.lhr\.rocks' tunnel.log | head -1 || \
                     grep -oP 'http://[a-z0-9-]+\.localhost\.run' tunnel.log | head -1)
        
        if [ -n "$TUNNEL_URL" ]; then
          echo "🌐 Web URL: $TUNNEL_URL"
          
          # للـ Minecraft، استخدم الدومين بدون http://
          MC_HOST=$(echo $TUNNEL_URL | sed 's|https\?://||')
          echo "🎮 Minecraft Server Address: $MC_HOST"
          echo "$MC_HOST" > server_address.txt
          
          echo ""
          echo "✨ Copy this address and paste it in Minecraft!"
          echo "✨ Server: $MC_HOST"
        else
          echo "⚠️  Tunnel URL not found in logs yet..."
          echo "⏳ Waiting 10 more seconds..."
          sleep 10
          
          # حاول تاني
          TUNNEL_URL=$(grep -oP 'https://[a-z0-9-]+\.lhr\.rocks' tunnel.log | head -1 || \
                       grep -oP 'http://[a-z0-9-]+\.localhost\.run' tunnel.log | head -1)
          
          if [ -n "$TUNNEL_URL" ]; then
            MC_HOST=$(echo $TUNNEL_URL | sed 's|https\?://||')
            echo "🎮 Minecraft Server Address: $MC_HOST"
            echo "$MC_HOST" > server_address.txt
          else
            echo "❌ Could not extract tunnel URL. Check logs above."
          fi
        fi
      else
        echo "❌ tunnel.log file not found!"
      fi
      
      echo "======================================"
      echo ""
  
  # بدء Minecraft Server
  run_server_script:
    - |
      echo "🎮 Starting Minecraft Fabric Server..."
      
      # شغل السيرفر مع JVM flags محسّنة
      java -Xmx22G -Xms18G \
        -XX:+UseG1GC \
        -XX:+ParallelRefProcEnabled \
        -XX:MaxGCPauseMillis=200 \
        -XX:+UnlockExperimentalVMOptions \
        -XX:+DisableExplicitGC \
        -XX:+AlwaysPreTouch \
        -XX:G1NewSizePercent=30 \
        -XX:G1MaxNewSizePercent=40 \
        -XX:G1HeapRegionSize=16M \
        -XX:G1ReservePercent=20 \
        -XX:G1HeapWastePercent=5 \
        -XX:G1MixedGCCountTarget=4 \
        -XX:InitiatingHeapOccupancyPercent=15 \
        -XX:G1MixedGCLiveThresholdPercent=90 \
        -XX:G1RSetUpdatingPauseTimePercent=5 \
        -XX:SurvivorRatio=32 \
        -XX:+PerfDisableSharedMem \
        -XX:MaxTenuringThreshold=1 \
        -jar fabric-server.jar nogui &
      
      SERVER_PID=$!
      echo "✅ Server started with PID: $SERVER_PID"
      
      # اطبع عنوان السيرفر مرة تانية
      if [ -f "server_address.txt" ]; then
        echo ""
        echo "=========================================="
        echo "🎮 MINECRAFT SERVER IS LIVE!"
        echo "=========================================="
        echo "Server Address: $(cat server_address.txt)"
        echo "=========================================="
        echo ""
      fi
      
      # مدة التشغيل: 110 دقيقة (6600 ثانية)
      MAX_TIME=6600
      ELAPSED=0
      
      # راقب السيرفر
      while [ $ELAPSED -lt $MAX_TIME ]; do
        # تحقق إذا السيرفر لسه شغال
        if ! kill -0 $SERVER_PID 2>/dev/null; then
          echo "❌ ERROR: Server stopped unexpectedly!"
          echo "Last 50 lines of server log:"
          tail -n 50 logs/latest.log 2>/dev/null || echo "No server logs available"
          break
        fi
        
        sleep 30
        ELAPSED=$((ELAPSED + 30))
        
        # تحديث كل 10 دقائق
        if [ $((ELAPSED % 600)) -eq 0 ]; then
          MINUTES=$((ELAPSED / 60))
          echo "⏱️  Server running for $MINUTES minutes..."
          
          # اطبع آخر سطر من الـ server log
          if [ -f "logs/latest.log" ]; then
            LAST_LINE=$(tail -n 1 logs/latest.log 2>/dev/null)
            echo "   Last log: $LAST_LINE"
          fi
        fi
      done
      
      # إيقاف السيرفر بأمان
      echo ""
      echo "🛑 Shutting down server gracefully..."
      if kill -0 $SERVER_PID 2>/dev/null; then
        # أرسل stop command للسيرفر
        echo "stop" > server_input.txt 2>/dev/null || true
        sleep 10
        
        # لو لسه شغال، استخدم SIGTERM
        if kill -0 $SERVER_PID 2>/dev/null; then
          kill -TERM $SERVER_PID 2>/dev/null || true
          sleep 5
        fi
        
        # آخر محاولة بـ SIGKILL
        kill -9 $SERVER_PID 2>/dev/null || true
      fi
      
      # أوقف الـ tunnel
      echo "🛑 Stopping localhost.run tunnel..."
      pkill -TERM ssh 2>/dev/null || true
      sleep 3
      
      echo "✅ Server shutdown complete."
  
  # احفظ الـ world دايماً
  always:
    save_world_script:
      - |
        echo ""
        echo "💾 Saving world data to GitHub..."
        git config user.email "bot@cirrus-ci.com"
        git config user.name "Cirrus CI Bot"
        
        # أضف كل الملفات
        git add -A
        
        # commit لو فيه تغييرات
        if ! git diff --cached --quiet; then
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          git commit -m "Auto-save world: $TIMESTAMP"
          
          # push مع retry (3 محاولات)
          echo "📤 Pushing changes to GitHub..."
          SUCCESS=0
          for i in 1 2 3; do
            if git push https://x-access-token:${GITHUB_TOKEN}@github.com/${CIRRUS_REPO_FULL_NAME}.git HEAD:main; then
              echo "✅ World saved successfully!"
              SUCCESS=1
              break
            else
              echo "⚠️  Push attempt $i/3 failed, retrying..."
              sleep 5
            fi
          done
          
          if [ $SUCCESS -eq 0 ]; then
            echo "❌ Failed to push after 3 attempts!"
          fi
        else
          echo "ℹ️  No changes to save."
        fi
    
    # أعد تشغيل الـ workflow تلقائياً
    retrigger_script:
      - |
        echo ""
        echo "⏳ Waiting 60 seconds before retriggering...
        
        OWNER=$(echo ${CIRRUS_REPO_FULL_NAME} | cut -d/ -f1)
        REPO=$(echo ${CIRRUS_REPO_FULL_NAME} | cut -d/ -f2)
        
        echo "🔄 Getting repository ID for ${OWNER}/${REPO}..."
        
        REPO_ID=$(curl -s \
          -H "Authorization: Bearer ${CIRRUS_API_TOKEN}" \
          -H "Content-Type: application/json" \
          -d "{\"query\":\"query { githubRepository(owner: \\\"${OWNER}\\\", name: \\\"${REPO}\\\") { id } }\"}" \
          https://api.cirrus-ci.com/graphql | jq -r '.data.githubRepository.id')
        
        if [ -n "$REPO_ID" ] && [ "$REPO_ID" != "null" ]; then
          echo "🚀 Triggering new build..."
          
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${CIRRUS_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation { trigger(input: {repositoryId: \\\"${REPO_ID}\\\", branch: \\\"main\\\"}) { build { id } } }\"}" \
            https://api.cirrus-ci.com/graphql)
          
          BUILD_ID=$(echo $RESPONSE | jq -r '.data.trigger.build.id')
          
          if [ -n "$BUILD_ID" ] && [ "$BUILD_ID" != "null" ]; then
            echo "✅ New build triggered successfully! Build ID: $BUILD_ID"
          else
            echo "❌ Failed to trigger build."
            echo "Response: $RESPONSE"
          fi
        else
          echo "❌ Failed to get repository ID!"
        fi
